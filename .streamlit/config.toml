# Local-only dashboard preferences: kill Streamlit's "Deploy" ad button
# and its usage telemetry. Nothing about this app is cloud-hosted.
[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#f1c40f"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#171a21"
textColor = "#e8eaf0"
